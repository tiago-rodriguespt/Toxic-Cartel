<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toxic Cartel</title>
    <link rel="shortcut icon" href="Imagens/logo.png" type="image/x-icon">
    <style>
        @charset "UTF-8";

        @font-face {
            font-family: 'rye';
            src: url('Fontes/Rye/Rye-Regular.ttf');
        }

        @font-face {
            font-family: 'family';
            src: url('Fontes/BungeeInline-Regular.ttf');
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-image: url(https://github.com/tiago-rodriguespt/Toxic-Cartel/blob/main/Imagens/fundo.jpg?raw=true);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        nav img {
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            transition: filter 0.1s ease;
        }

        nav {
            font-family: 'rye';
            font-size: 2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 0 auto;
            max-width: 2000px;
            width: 100%;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav a.atual {
            color: red;
            text-decoration: underline;
            text-underline-offset: 20px;
        }

        nav a:hover {
            color: red;
            text-decoration: underline;
            text-underline-offset: 20px;
        }

        nav:hover a.atual {
            color: red;
            text-decoration: none;
        }

        div.active {
            display: flex;
            gap: 60px;
            margin: 0 auto;
        }

        div.active2 {
            display: flex;
            margin: 0 auto;
            gap: 60px;
            align-items: center;
        }

        .text {
            color: white;
            margin: auto;
            text-align: center;
            font-size: 3em;
            font-family: 'family';
            text-shadow: 0px 0px 20px #7c7b7b91;
            margin-top: 100px;
        }

        h2 {
            font-size: 2em;
        }

        .cor {
            color: #ec8181;
            font-size: 2.4em;
            text-shadow: 0px 0px 20px #f180808e;
            display: inline-block;
            transition: text-shadow 0.1s ease, transform 0.1s ease;
        }

        /* --- Efeito de Cursor de Terminal --- */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 0.8em;
            background-color: #ec8181;
            margin-left: 5px;
            vertical-align: middle;
            animation: piscar 0.7s infinite;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- Efeito Glitch (Falha de Sistema) --- */
        .glitch-efecto {
            animation: glitch-anim 0.25s linear infinite;
            text-shadow: -3px 0 red, 3px 0 cyan !important;
            transform: skew(-2deg);
        }

        .glitch-logo {
            animation: glitch-anim 0.25s linear infinite;
            filter: drop-shadow(-3px 0px red) drop-shadow(3px 0px cyan);
            transform: skew(-3deg);
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) skew(0deg); }
            20% { transform: translate(-3px, 2px) skew(-2deg); }
            40% { transform: translate(-2px, -2px) skew(2deg); }
            60% { transform: translate(3px, 1px) skew(-1deg); }
            80% { transform: translate(2px, -1px) skew(1deg); }
            100% { transform: translate(0) skew(0deg); }
        }

        /* --- Estilo do Alerta do Cartel (Notificação) --- */
        #cartel-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: rgba(15, 15, 15, 0.95);
            border-left: 5px solid red;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 350px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(20px);
        }

        #cartel-toast.ativo {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .toast-content h4 {
            color: #ec8181;
            font-size: 0.95em;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .toast-content p {
            font-size: 0.85em;
            color: #cccccc;
        }

        .toast-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2em;
            cursor: pointer;
            margin-left: auto;
        }

        .toast-close:hover {
            color: white;
        }

        /* --- Modo Segurança Máxima (Easter Egg) --- */
        #security-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            background: rgba(255, 0, 0, 0.08);
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.4);
            display: none;
        }

        #security-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 9999;
            pointer-events: none;
        }

        #security-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: red;
            color: black;
            font-family: 'rye';
            text-align: center;
            padding: 8px;
            font-size: 1.1em;
            z-index: 10000;
            display: none;
            letter-spacing: 2px;
            box-shadow: 0px 0px 20px red;
        }

        /* ========================================================
            MEDIA QUERY (AFETA APENAS O TELEMÓVEL)
        ======================================================== */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                font-size: 1.1em;
                padding: 10px;
            }

            .image {
                order: -1;
            }

            nav img {
                max-width: 80px;
            }

            div.active, div.active2 {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .text {
                font-size: 1.2em;
                margin-top: 40px;
                padding: 0 15px;
            }

            .cor {
                font-size: 1.8em;
            }

            h2 {
                font-size: 1.2em;
            }

            #cartel-toast {
                bottom: 15px;
                right: 15px;
                left: 15px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <!-- Elementos do Modo Segurança Máxima -->
    <div id="security-banner">🚨 MODO DE SEGURANÇA MÁXIMA — ACESSO RESTRITO AO TOXIC CARTEL 🚨</div>
    <div id="security-overlay"></div>

    <!-- Alerta / Notificação do Cartel -->
    <div id="cartel-toast">
        <div style="font-size: 1.5em;">📡</div>
        <div class="toast-content">
            <h4>Canal Encriptado</h4>
            <p>Nova diretiva tática disponível no Discord oficial do Cartel.</p>
        </div>
        <button class="toast-close" onclick="fecharAlerta()">&times;</button>
    </div>

    <header>
        <div class="box">
            <nav>
                <div class="active">
                    <a href="index.html" class="atual">Início</a>
                    <a href="recruta.html" class="recruta">Recrutamento</a>
                    <a href="regras.html">Regras</a>
                </div>

                <div class="image">
                    <p><img src="Imagens/logo.png" alt="Logo" id="cartel-logo"></p>
                </div>

                <div class="active2">
                    <a href="galeria.html">Galeria</a>
                    <a href="https://discord.gg/2Jnseuge7v" target="_blank">Discord</a>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="text">
            <h1 class="cor" id="typing-text"></h1> <br>
            <h2>O SEU CAMINHO COMEÇA AQUI.</h2>
        </div>
    </main>

    <script>
        // --- 1. Efeito de Terminal ---
        const texto = "BEM-VINDO AO TOXIC CARTEL";
        const elementoTexto = document.getElementById("typing-text");
        let index = 0;
        const velocidade = 75;

        const cursor = document.createElement("span");
        cursor.className = "cursor";

        function digitar() {
            if (index < texto.length) {
                elementoTexto.innerHTML = texto.substring(0, index + 1);
                elementoTexto.appendChild(cursor);
                index++;
                setTimeout(digitar, velocidade);
            } else {
                elementoTexto.appendChild(cursor);
            }
        }

        window.onload = function() {
            digitar();

            // --- 2. Sistema de Notificações (Alerta) ---
            setTimeout(function() {
                const toast = document.getElementById("cartel-toast");
                if(toast) {
                    toast.classList.add("ativo");
                }
            }, 2000);

            // --- 3. Efeito Glitch Aleatório ---
            setInterval(function() {
                const logo = document.getElementById("cartel-logo");
                const titulo = document.getElementById("typing-text");

                if (Math.random() > 0.5) {
                    if (titulo) {
                        titulo.classList.add("glitch-efecto");
                        setTimeout(() => titulo.classList.remove("glitch-efecto"), 250);
                    }
                } else {
                    if (logo) {
                        logo.classList.add("glitch-logo");
                        setTimeout(() => logo.classList.remove("glitch-logo"), 250);
                    }
                }
            }, 4000); // Dá uma falha rápida a cada 4 segundos
        };

        function fecharAlerta() {
            const toast = document.getElementById("cartel-toast");
            if(toast) {
                toast.classList.remove("ativo");
            }
        }

        // --- 4. Modo Segurança Máxima (Easter Egg: 'T' e depois 'C') ---
        let teclasPressionadas = "";
        let modoSegurancaAtivo = false;

        window.addEventListener("keydown", function(event) {
            let tecla = event.key.toUpperCase();
            
            if (tecla === 'T' || tecla === 'C') {
                teclasPressionadas += tecla;
                
                if (teclasPressionadas.length > 2) {
                    teclasPressionadas = teclasPressionadas.slice(-2);
                }

                if (teclasPressionadas === "TC") {
                    modoSegurancaAtivo = !modoSegurancaAtivo;
                    
                    const overlay = document.getElementById("security-overlay");
                    const banner = document.getElementById("security-banner");

                    if (modoSegurancaAtivo) {
                        overlay.style.display = "block";
                        banner.style.display = "block";
                    } else {
                        overlay.style.display = "none";
                        banner.style.display = "none";
                    }

                    teclasPressionadas = "";
                }
            } else {
                teclasPressionadas = "";
            }
        });
    </script>
</body>
</html>
