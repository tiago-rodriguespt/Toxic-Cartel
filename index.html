<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toxic Cartel</title>
    <link rel="shortcut icon" href="Imagens/logo.png" type="image/x-icon">
    <style>
        @charset "UTF-8";

        @font-face {
            font-family: 'rye';
            src: url('Fontes/Rye/Rye-Regular.ttf');
        }

        @font-face {
            font-family: 'family';
            src: url('Fontes/BungeeInline-Regular.ttf');
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-image: url(https://github.com/tiago-rodriguespt/Toxic-Cartel/blob/main/Imagens/fundo.jpg?raw=true);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BANNER / NAV NO COMPUTADOR */
        nav {
            font-family: 'rye';
            font-size: 1.5em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 0 auto;
            width: 100%;
            max-width: 1400px;
        }

        nav img {
            max-width: 100px;
            height: auto;
            display: block;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav a.atual, nav a:hover {
            color: red;
            text-decoration: underline;
            text-underline-offset: 10px;
        }

        div.active, div.active2 {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        /* TEXTO PRINCIPAL */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .text {
            color: white;
            text-align: center;
            font-family: 'family';
            text-shadow: 0px 0px 20px #7c7b7b91;
            max-width: 900px;
        }

        .cor {
            color: #ec8181;
            font-size: 3em;
            text-shadow: 0px 0px 20px #f180808e;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2em;
        }

        /* ========================================================
           MEDIA QUERY - AJUSTES EXCLUSIVOS PARA TELEMÓVEL
        ======================================================== */
        @media (max-width: 768px) {
            
            /* Reorganiza a navegação para ficar vertical e centrada */
            nav {
                flex-direction: column;
                gap: 15px;
                font-size: 1.1em;
                padding: 15px 10px;
            }

            /* A logo fica no topo no telemóvel */
            .image {
                order: -1;
            }

            nav img {
                max-width: 80px;
            }

            /* Junta os links numa linha ajustável */
            div.active, div.active2 {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                width: 100%;
            }

            /* Reduz o tamanho do texto do título */
            .cor {
                font-size: 1.6em;
                line-height: 1.3;
            }

            h2 {
                font-size: 1.1em;
            }

            .text {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="box">
            <nav>
                <div class="active">
                    <a href="index.html" class="atual">Início</a>
                    <a href="recruta.html" class="recruta">Recrutamento</a>
                    <a href="regras.html">Regras</a>
                </div>

                <div class="image">
                    <img src="Imagens/logo.png" alt="Logo">
                </div>

                <div class="active2">
                    <a href="galeria.html">Galeria</a>
                    <a href="https://discord.gg/2Jnseuge7v" target="_blank">Discord</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="text">
            <h1 class="cor">BEM-VINDO AO TOXIC CARTEL</h1>
            <h2>O SEU CAMINHO COMEÇA AQUI.</h2>
        </div>
    </main>
</body>
</html>
